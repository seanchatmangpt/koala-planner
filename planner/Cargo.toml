[package]
name = "planner"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "planner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
agent-cli = [
  "dep:clap-noun-verb",
  "dep:clap-noun-verb-macros",
  "dep:linkme",
  "dep:koala-serializer",
]

[[bin]]
name = "planner"
path = "src/main.rs"

[[bin]]
name = "koala"
path = "src/bin/koala/main.rs"
required-features = ["agent-cli"]

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
rand = "0.8"
regex = "1.10.0"
bit-vec = "*"
clap-noun-verb = { version = "=26.9.1", optional = true }
clap-noun-verb-macros = { version = "=26.9.1", optional = true }
linkme = { version = "0.3.37", optional = true }
koala-serializer = { path = "../crates/koala-serializer", optional = true }
